[workspace]
members = [
    # Language crates (dependency order)
    "crates/kinetix_lexer",
    "crates/kinetix_ast",
    "crates/kinetix_parser",
    "crates/kinetix_types",
    "crates/kinetix_hir",
    "crates/kinetix_mir",
    "crates/kinetix_bytecode",
    "crates/kinetix_vm",
    "crates/kinetix_gc",
    "crates/kinetix_codegen",
    "crates/kinetix_jit",
    "crates/kinetix_stdlib",
    "crates/kinetix_debugger",
    "crates/kinetix_lsp",
    "crates/kinetix_syntax",
    "crates/kinetix_ide",
    # CLI tools
    "tools/kxc",
    "tools/kxr",
    "tools/kxfmt",
    "tools/kxpkg",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Kinetix Language Team"]
license      = "MIT"
repository   = "https://github.com/kinetix-lang/kinetix"
homepage     = "https://kinetix-lang.org"
rust-version = "1.78"

# ── Shared dependencies ─────────────────────────────────────────────────────

[workspace.dependencies]
# Internal crates
kinetix_lexer    = { path = "crates/kinetix_lexer" }
kinetix_ast      = { path = "crates/kinetix_ast" }
kinetix_parser   = { path = "crates/kinetix_parser" }
kinetix_types    = { path = "crates/kinetix_types" }
kinetix_hir      = { path = "crates/kinetix_hir" }
kinetix_mir      = { path = "crates/kinetix_mir" }
kinetix_bytecode = { path = "crates/kinetix_bytecode" }
kinetix_vm       = { path = "crates/kinetix_vm" }
kinetix_gc       = { path = "crates/kinetix_gc" }
kinetix_codegen  = { path = "crates/kinetix_codegen" }
kinetix_jit      = { path = "crates/kinetix_jit" }
kinetix_stdlib   = { path = "crates/kinetix_stdlib" }
kinetix_debugger = { path = "crates/kinetix_debugger" }
kinetix_lsp      = { path = "crates/kinetix_lsp" }
kinetix_syntax   = { path = "crates/kinetix_syntax" }
kinetix_ide      = { path = "crates/kinetix_ide" }

# GUI
egui         = "0.29"
eframe       = { version = "0.29", features = ["default_fonts", "persistence"] }
egui_extras  = { version = "0.29", features = ["all_loaders"] }

# JIT backend (Cranelift)
cranelift-codegen  = { version = "0.112", features = ["all-arch"] }
cranelift-frontend = "0.112"
cranelift-jit      = "0.112"
cranelift-module   = "0.112"
cranelift-native   = "0.112"
cranelift-object   = "0.112"

# LSP
lsp-server = "0.7"
lsp-types  = "0.95"

# Async runtime
tokio        = { version = "1", features = ["full"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# File watching
notify       = "6"

# PTY (terminal emulation)
portable-pty = "0.8"

# Logging
log          = "0.4"
env_logger   = "0.11"

# Error handling
anyhow       = "1"
thiserror    = "1"

# CLI
clap         = { version = "4", features = ["derive"] }
rustyline    = "14"


# String utilities
unicode-width = "0.1"
smol_str      = "0.3"

# Index types
index_vec     = "0.1"

# Cross-platform paths
dirs         = "5"

# Numeric
num-traits   = "0.2"

# Hashing
rustc-hash   = "2"

# ── Build profiles ──────────────────────────────────────────────────────────

[profile.dev]
opt-level    = 1
debug        = true

[profile.dev.package."*"]
opt-level    = 2   # optimize dependencies even in dev

[profile.release]
opt-level    = 3
lto          = "thin"
codegen-units = 1
strip        = "symbols"
panic        = "abort"

[profile.bench]
inherits     = "release"
debug        = true
