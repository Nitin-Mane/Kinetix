[workspace]
members = [
    "crates/kinetix_lexer",
    "crates/kinetix_syntax",
    "crates/kinetix_lsp",
    "crates/kinetix_ide",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Kinetix Team"]
license      = "MIT"
repository   = "https://github.com/kinetix-lang/kinetix_ide"
rust-version = "1.78"

[workspace.dependencies]
# GUI
egui         = "0.29"
eframe       = { version = "0.29", features = ["default_fonts", "persistence"] }
egui_extras  = { version = "0.29", features = ["all_loaders"] }

# Async runtime
tokio        = { version = "1", features = ["full"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# File watching
notify       = "6"

# PTY (terminal emulation)
portable-pty = "0.8"

# Logging
log          = "0.4"
env_logger   = "0.11"

# Error handling
anyhow       = "1"
thiserror    = "1"

# Cross-platform paths
dirs         = "5"

# String utilities
unicode-width = "0.1"

[profile.dev]
opt-level    = 1

[profile.release]
opt-level    = 3
lto          = true
codegen-units = 1
strip        = "symbols"
